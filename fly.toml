# Fly.io config for the London Pipeline public demo.
# Create the app first (no sign-in performed by this repo):
#   fly launch --no-deploy   # accept generated name, then `fly deploy`
# Secrets (never commit): fly secrets set MODEL_API_KEY=... META_BASE_URL=... META_MODEL=...

app = "london-pipeline"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[env]
  META_BASE_URL = "https://api.meta.ai/v1"
  META_MODEL = "muse-spark-1.3"
  RATE_LIMIT_MAX = "15"
  RATE_LIMIT_BRIEF_MAX = "60"
  RATE_LIMIT_WINDOW_SECONDS = "3600"
  RATE_LIMIT_DAILY_MAX = "300"
